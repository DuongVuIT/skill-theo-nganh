    <g transform="translate(840 102)"><rect width="192" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><circle cx="20" cy="20" r="6" fill="#22c55e"/><text x="36" y="26">Điện tử &amp; cơ khí</text></g>
    <g transform="translate(1046 102)"><rect width="192" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><circle cx="20" cy="20" r="6" fill="#ec4899"/><text x="36" y="26">Design</text></g>
    <g transform="translate(840 154)"><rect width="192" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><circle cx="20" cy="20" r="6" fill="#f97316"/><text x="36" y="26">Marketing</text></g>
    <g transform="translate(1046 154)"><rect width="192" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><circle cx="20" cy="20" r="6" fill="#eab308"/><text x="36" y="26">Tài chính</text></g>
    <g transform="translate(840 206)"><rect width="192" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><circle cx="20" cy="20" r="6" fill="#a78bfa"/><text x="36" y="26">Pháp lý</text></g>
    <g transform="translate(1046 206)"><rect width="192" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><circle cx="20" cy="20" r="6" fill="#14b8a6"/><text x="36" y="26">Quản lý</text></g>
    <g transform="translate(840 258)"><rect width="192" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><circle cx="20" cy="20" r="6" fill="#38bdf8"/><text x="36" y="26">Giáo dục</text></g>
    <g transform="translate(1046 258)"><rect width="192" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><circle cx="20" cy="20" r="6" fill="#84cc16"/><text x="36" y="26">Khoa học</text></g>
    <g transform="translate(840 310)"><rect width="192" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><circle cx="20" cy="20" r="6" fill="#94a3b8"/><text x="36" y="26">Văn phòng</text></g>
    <g transform="translate(1046 310)"><rect width="192" height="40" rx="20" fill="#f97316" fill-opacity=".22" stroke="#fb923c" stroke-opacity=".6"/><circle cx="20" cy="20" r="6" fill="#ef4444"/><text x="36" y="26" fill="#fed7aa">Tiếng Việt</text></g>
